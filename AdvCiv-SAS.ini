
[CONFIG]

; Modular XML Loading
ModularLoading = 0

; Skip Main menu
SkipMainMenu = 0

; Custom Art from user folder is not loaded
NoCustomArt = 0

; Custom XML and Python from user folder are not loaded
NoCustomAssets = 1

; No Custom Scenario option in main menu
NoCustomScenario = 0

; No team play allowed
NoTeams = 0

; Read Game options from XML, not .ini
ForceGameOptions = 0

; Always start in the standard era
ForceStandardEra = 0

; Scenario file (Single player)
ForceScenario = 0

; This mod is only for single player games
SinglePlayerOnly = 0

; Allow public maps to be used with this mod
AllowPublicMaps = 1

; Mod Image file
ImageFile = 0

; Name of Mod
; <!-- custom: AdvCiv-SAS Mod rename: authoritative branded/project name for SAS runtime C++/Python/UI/logging. ModName caches this value before XML/Python startup; keep it distinct from the actual loaded folder name. The INI filename follows Civ4's loaded-folder convention and must be renamed with that folder. See KI#110.2. (ChatGPT-5.6-Sol) -->
Name = AdvCiv-SAS

; Description of Mod <!-- custom: Keep this separate from the authoritative branded runtime Name above; update it manually if a fork wants a different launcher/mod description. See KI#110.2. (ChatGPT-5.6-Sol + GPT-6.1-Sol) -->
Description = Generic Mod
