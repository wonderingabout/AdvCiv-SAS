name: Checks - Documentation

on:
  push:
  pull_request:
    # <!-- custom: Ignore the long-lived reference compare from main to the mirrored base AdvCiv 1.14 branch.
    # Keep it open so GitHub tracks the diff, but do not run duplicate PR checks for it. (ChatGPT-5.5) -->
    branches-ignore:
      - "1.14"
  workflow_dispatch:

jobs:
  documentation:
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          # <!-- custom: Restored range/history checks need complete commit metadata; blob filtering avoids eagerly downloading historical DLLs and assets. (GPT-6.1-Sol) -->
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v7
        # <!-- custom: Each check runs even when an earlier one failed, so one push reports every failure at once rather than stopping at the first; the job still fails, and a setup failure still stops the checks. (Claude code Opus 5.5) -->
        id: setup
        with:
          python-version: "3.x"

      - name: Folder indexes
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/documentation/folder_indexes.py

      - name: Markdown images
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/documentation/markdown_images.py

      - name: Named example artifact locations
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/documentation/example_file_locations.py --base-ref "$BASE_REF" --event-name "$EVENT_NAME"

      - name: Documentation image filename policy
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/documentation/image_filename_policy.py

      - name: Markdown links and anchors
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/documentation/markdown_links.py

      - name: Long-comment archive references
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/documentation/long_comments.py

      - name: Markdown menus, anchors and structure
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/documentation/markdown_structure.py

      - name: Markdown list layout and edited prose
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/documentation/markdown_prose_changes.py --base-ref "$BASE_REF" --event-name "$EVENT_NAME"

      - name: SAS shipped source links in README and Main Changes Guide
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/documentation/sas_source_guide.py --base-ref "$BASE_REF" --event-name "$EVENT_NAME"

      # <!-- custom: Make generated diagnostic artifacts findable by explicit filename/path in both reader overviews; source links alone do not name the output JSON/JSONL. (GPT-6.1-Sol) -->
      - name: Diagnostic output filenames and locations
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/documentation/diagnostic_artifact_names.py

      # <!-- custom: A Drive link copied from another entry still opens a real folder, so the wrong evidence goes unnoticed; require each Drive file or folder once per document. (Claude Code Opus 5.5) -->
      - name: Google Drive links once per document
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/documentation/drive_links.py

      # <!-- custom: A disclaimer protects only if readers meet it before anything else, so keep each listed guide's disclaimer directly under its title. (Claude code Opus 5.5) -->
      - name: Guide disclaimers first
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/documentation/disclaimers_first.py

      - name: Known Issues update chronology
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/documentation/known_issues_chronology.py --base-ref "$BASE_REF" --event-name "$EVENT_NAME"

      # <!-- custom: CI has no Civ4 art to render with, so compare the renderer's code with the fingerprint regenerate_art_samples.py recorded after its last full run. (Claude code Opus 5.5) -->
      - name: Art sample freshness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/documentation/art_samples.py

      - name: Generated documentation freshness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/documentation/generated_docs.py --base-ref "$BASE_REF" --event-name "$EVENT_NAME"
