name: Checks - Source

on:
  push:
  pull_request:
    # <!-- custom: Ignore the long-lived reference compare from main to the mirrored base AdvCiv release branch, named by its version, such as 1.14.
    # Keep it open so GitHub tracks the diff, but do not run duplicate PR checks for it.
    # The pattern matches any version, so a newer AdvCiv's branch needs no edit here (2026-11-22). (ChatGPT-5.5 + Claude code Opus 5.5) -->
    branches-ignore:
      - "[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          # <!-- custom: Restored range/history checks need complete commit metadata; blob filtering avoids eagerly downloading historical DLLs and assets. (GPT-6.1-Sol) -->
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v7
        # <!-- custom: Each check runs even when an earlier one failed, so one push reports every failure at once rather than stopping at the first; the job still fails, and a setup failure still stops the checks. (Claude code Opus 5.5) -->
        id: setup
        with:
          python-version: "3.x"

      - name: Source change provenance
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/source/source_change_provenance.py --base-ref "$BASE_REF" --event-name "$EVENT_NAME"

      - name: Shared Python resource API contracts
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/source/python_resource_api.py --base-ref "$BASE_REF" --event-name "$EVENT_NAME"

      - name: Fail-fast XML identity lookups
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/source/raw_getinfotype.py

      - name: Sevopedia pages read only defined self.top attributes
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/source/sevopedia_top_attributes.py

      - name: Copies of base-game files and inherited Python imports match the inherited files audit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/source/inherited_files.py

      - name: Byte comparisons in CI scripts say why
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/source/checkout_byte_compares.py

      - name: DLL source keeps the standard C++ forms AdvCiv's advc.cppstd introduced
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/source/cpp_standard_conformance.py

      - name: Switched define values are written only in LLM_Helpers/diagnostics/define_values.py
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/source/shared_define_values.py

      - name: Every advisor leaving the scoreboard space carries SAS_LEAVES_SCOREBOARD_SPACE
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/source/advisor_scoreboard_space.py

      - name: Runtime Python never starts a button path as u""
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/source/unicode_button_paths.py

      - name: Runtime Python string comparisons say why
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/source/string_label_compares.py

      - name: Runtime Python never formats an integer division with %.Nf
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/source/float_format_int_division.py

      - name: Runtime Python writes each call on one line
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/source/python_multiline_calls.py

      - name: Runtime Python aligns columns with tabs and leaves one space elsewhere
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/source/python_aligned_columns.py

      - name: Python bindings point at their own enumerator or method
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/source/python_binding_targets.py

      - name: Python wrappers pass None on where the native call takes NULL
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/source/python_wrapper_null_args.py

      - name: Lint suppressions name their rule and reason
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/source/lint_suppressions.py

      - name: Custom-comment logical reflow
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python LLM_Helpers/formatting/reflow_custom_comments.py --check

      - name: Custom-comment indentation
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/source/custom_comment_indentation.py
