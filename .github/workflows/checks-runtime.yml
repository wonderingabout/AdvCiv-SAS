name: Checks - Runtime

on:
  push:
  pull_request:
    # <!-- custom: Ignore the long-lived reference compare from main to the mirrored base AdvCiv 1.14 branch.
    # Keep it open so GitHub tracks the diff, but do not run duplicate PR checks for it. (ChatGPT-5.5) -->
    branches-ignore:
      - "1.14"
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        # <!-- custom: Each check runs even when an earlier one failed, so one push reports every failure at once rather than stopping at the first; the job still fails, and a setup failure still stops the checks. (Claude code Opus 5.5) -->
        id: setup
        with:
          python-version: "3.x"

      - name: Detail-manager configuration
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/runtime/detail_manager.py

      - name: AIP defaults
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/runtime/aip.py

      - name: AIP predump freshness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/runtime/aip_predump_values.py

      - name: World-size alignment
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/runtime/worldsizes.py

      - name: Map-script classification
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/workflows/build/runtime/mapscripts.py
